name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gitaihub
          POSTGRES_PASSWORD: gitaihub
          POSTGRES_DB: gitaihub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gitaihub"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          GITAIHUB_TEST_DATABASE_URL: postgres://gitaihub:gitaihub@localhost:5432/gitaihub_test?sslmode=disable

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end (docker compose)
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # gitai compiles its bundled Git, so its image is cached between runs.
      - name: Build gitai image
        uses: docker/build-push-action@v6
        with:
          context: deploy/gitai
          tags: gitaihub/gitai:v0.4.2
          load: true
          cache-from: type=gha,scope=gitai
          cache-to: type=gha,scope=gitai,mode=max
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: api
          tags: gitaihub/api:dev
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          tags: gitaihub/web:dev
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Start the stack
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180
          scripts/wait-for-demo.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
